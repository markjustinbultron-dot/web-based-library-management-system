<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Library System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white text-center">
                    <h4 class="mb-0">Create Account</h4>
                </div>
                <div class="card-body p-4">

                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

					<form id="registerForm"
					      th:action="@{/register}"
					      th:object="${user}"
					      method="post">
                        
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="Mark Justin A. Bultron" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="user@gmail.com" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">ID Number / Student No.</label>
                            <input type="text" th:field="*{idNumber}" class="form-control" placeholder="2024600333" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="text" th:field="*{phoneNumber}" class="form-control" placeholder="09123456789" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Account Type</label>
                            <select th:field="*{role}" class="form-select" required>
                                <option value="STUDENT">Student</option>
                            </select>
                        </div>


						<div class="mb-3">
						    <label class="form-label">Password</label>
						    <input type="password"
						           th:field="*{password}"
						           class="form-control"
						           minlength="8"
						           required />

						    <div class="form-text">
						        Your password must:
						        <ul class="mb-0">
						            <li>Contain at least 8 characters.</li>
						            <li>Include at least one uppercase letter (A–Z).</li>
						            <li>Include at least one lowercase letter (a–z).</li>
						            <li>Include at least one number (0–9).</li>
						        </ul>
						    </div>
						</div>
						

						<div class="mb-3">
						    <label class="form-label">Confirm Password</label>
							<input type="password"
							       id="confirmPassword"
							       name="confirmPassword"
							       class="form-control"
							       required />

						</div>


                        <button type="submit" class="btn btn-primary w-100">Register</button>
                    </form>

                    <div class="text-center mt-3">
                        <small>Already have an account? <a href="/login">Login here</a></small>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>



<script>
    document.addEventListener('DOMContentLoaded', function () {
        const registerForm = document.getElementById('registerForm');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');

        registerForm.addEventListener('submit', function (event) {
            if (passwordInput.value !== confirmPasswordInput.value) {
                event.preventDefault();
                alert('Passwords do not match. Please try again.');
                confirmPasswordInput.focus();
            }
        });
    });
</script>



</body>
</html>
