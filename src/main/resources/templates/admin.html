<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Library System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Library Admin Dashboard</a>
        <div>
            <a href="/" class="btn btn-outline-light me-2">View Catalog</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-danger">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container my-5">

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="row mb-4">
        <!-- Add Book Form -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Add New Book</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/add-book}" th:object="${newBook}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" th:field="*{title}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Author</label>
                            <input type="text" th:field="*{author}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ISBN</label>
                            <input type="text" th:field="*{isbn}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Available Copies</label>
                            <input type="number" th:field="*{availableCopies}" class="form-control" min="1" required>
                        </div>
						<div class="mb-3">
						    <label class="form-label">Book Type</label>
						    <select th:field="*{bookType}" class="form-select" required>
						        <option value="PHYSICAL">Physical Book</option>
						        <option value="EBOOK">E-Book</option>
						    </select>
						</div>
                        <button type="submit" class="btn btn-primary w-100">Add Book</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Book List Table -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-secondary text-white">
                    <h5 class="mb-0">Manage Book Inventory</h5>
                </div>
                <div class="card-body">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Author</th>
                                <th>ISBN</th>
                                <th>Available</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="book : ${books}">
                                <td th:text="${book.title}">Title</td>
                                <td th:text="${book.author}">Author</td>
                                <td th:text="${book.isbn}">ISBN</td>
                                <td th:text="${book.availableCopies}">0</td>
                                <td>
                                    <form th:action="@{/admin/delete-book/{id}(id=${book.id})}" method="post">
                                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
