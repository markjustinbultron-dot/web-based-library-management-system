<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Book Catalog - Library System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/books">Library Management</a>
        <div class="navbar-nav ms-auto align-items-center">
            <a class="nav-link text-white me-2" href="/profile">My Profile</a>
            <a sec:authorize="hasRole('ADMIN')" class="nav-link text-warning fw-bold me-2" href="/admin/dashboard">Admin Dashboard</a>
            
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-link nav-link text-white text-decoration-none m-0 p-0">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Book Catalog</h2>
    </div>
	

	<div class="card shadow-sm mb-4">
	    <div class="card-body">
	        <form th:action="@{/books}" method="get">
	            <div class="row g-3 align-items-end">

	                <div class="col-md-4">
	                    <label for="keyword" class="form-label">Search Books</label>
	                    <input type="text"
	                           id="keyword"
	                           name="keyword"
	                           class="form-control"
	                           placeholder="Search by title or author..."
	                           th:value="${keyword}">
	                </div>

	                <div class="col-md-3">
	                    <label for="genre" class="form-label">Filter by Genre</label>
	                    <select id="genre" name="genre" class="form-select">
	                        <option value="">All Genres</option>
	                        <option th:each="g : ${genres}"
	                                th:value="${g}"
	                                th:text="${g}"
	                                th:selected="${g == selectedGenre}">
	                        </option>
	                    </select>
	                </div>

					<div class="col-md-3">
					    <label for="sortBy" class="form-label">Sort By</label>
					    <select id="sortBy" name="sortBy" class="form-select">
					        <option value="title" th:selected="${sortBy == 'title'}">Title</option>
					        <option value="author" th:selected="${sortBy == 'author'}">Author</option>
					        <option value="genre" th:selected="${sortBy == 'genre'}">Genre</option>
					    </select>
					</div>

	                <div class="col-md-2 d-flex gap-2">
	                    <button type="submit" class="btn btn-primary">
	                        Search / Filter
	                    </button>
	                    <a th:href="@{/books}" class="btn btn-outline-secondary">
	                        Reset
	                    </a>
	                </div>

	            </div>
	        </form>
	    </div>
	</div>


    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-primary">
                        <tr>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Type</th>
                            <th>Genre</th>
                            <th>ISBN</th>
                            <th>Available / Total</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="book : ${books}">
                            <td class="fw-bold" th:text="${book.title}">Sample Book</td>
                            <td th:text="${book.author}">Jane Doe</td>
                            <!-- Book Type Column -->
                            <td>
                                <span class="badge" 
                                      th:classappend="${book.bookType != null and book.bookType.name() == 'EBOOK'} ? 'bg-info text-dark' : 'bg-secondary'"
                                      th:text="${book.bookType != null ? book.bookType : 'PHYSICAL'}">PHYSICAL</span>
                            </td>
                            <td>
                                <span class="badge bg-light text-dark border" th:text="${book.genre != null ? book.genre : 'General'}">Fiction</span>
                            </td>
                            <td th:text="${book.isbn}">123-456789</td>
                            <td>
                                <span th:text="${book.availableCopies}">5</span> / 
                                <span th:text="${book.totalCopies}">10</span>
                            </td>
                            <td class="text-center">
                                <form th:if="${book.availableCopies > 0}" th:action="@{/books/borrow/{id}(id=${book.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-primary">Borrow</button>
                                </form>
                                <button th:if="${book.availableCopies <= 0}" class="btn btn-sm btn-secondary" disabled>Out of Stock</button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(books)}">
                            <td colspan="7" class="text-center text-muted p-4">No books available in the catalog.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
